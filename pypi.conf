# Define the cache path
proxy_cache_path /var/cache/nginx/pypi_cache levels=1:2 keys_zone=pypi_cache:50m max_size=10g inactive=30d use_temp_path=off;

server {
    listen 80;

    set_real_ip_from 10.42.1.38;
    real_ip_header X-Real-IP;

    location / {
        proxy_cache pypi_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout;
        proxy_pass https://pypi.tuna.tsinghua.edu.cn/;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /secoder_inner_stub_status {
        stub_status on;
        access_log off;
        #auth_basic "Unauthorized";
        #auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
